<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Automatisation MCP — séquence vidéo</title>
<style>
  :root{ --bg:#050607; --ui:#0f1013; --line:rgba(255,255,255,.1); --txt:#fff; --dim:#8b8b96;
         --accent:#3B82F6; --green:#31c48d; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
  .stage{width:min(100%,1180px);aspect-ratio:16/9;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);background:#000}
  canvas{display:block;width:100%;height:100%}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:11px 18px;cursor:pointer;
    border:1px solid var(--line);background:#16171b;color:#e6e6ee;transition:.18s}
  button:hover{border-color:#3a3b44;color:#fff}
  button.primary{background:var(--accent);border-color:transparent;color:#fff;
    box-shadow:0 10px 26px rgba(59,130,246,.3)}
  button.primary:hover{filter:brightness(1.07)}
  button:disabled{opacity:.5;cursor:default}
  .hint{font-size:12.5px;color:var(--dim);text-align:center;max-width:640px;line-height:1.6}
  .rec{display:inline-flex;align-items:center;gap:8px}
  .rec i{width:9px;height:9px;border-radius:50%;background:#ff4d4d;animation:b .8s infinite}
  @keyframes b{50%{opacity:.2}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div class="bar">
    <button class="primary" id="rec">Exporter la vidéo (WebM)</button>
    <button id="replay">Rejouer</button>
    <span class="hint" id="status">Boucle automatique · 13 s</span>
  </div>
  <p class="hint">L'export enregistre exactement un cycle en 1920×1080. Le fichier <b>.webm</b> se télécharge automatiquement à la fin — convertible en MP4 si votre montage l'exige.</p>
</div>

<script src="assets/workflow-mcp-video.js"></script>
</body>
</html>
