<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="LB">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#0b2416"/>
      <stop offset="1" stop-color="#050805"/>
    </radialGradient>
    <linearGradient id="lb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8dffb8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fond terminal -->
  <rect width="32" height="32" rx="6.5" fill="url(#bg)"/>

  <!-- pluie de code Matrix, tres discrete -->
  <g fill="#22c55e" opacity="0.16">
    <rect x="5"  y="3"  width="1" height="3"/><rect x="5"  y="8"  width="1" height="2"/><rect x="5"  y="13" width="1" height="3"/><rect x="5"  y="20" width="1" height="2"/>
    <rect x="16" y="2"  width="1" height="2"/><rect x="16" y="6"  width="1" height="3"/><rect x="16" y="27" width="1" height="3"/>
    <rect x="27" y="4"  width="1" height="3"/><rect x="27" y="10" width="1" height="2"/><rect x="27" y="24" width="1" height="3"/><rect x="27" y="29" width="1" height="2"/>
  </g>

  <!-- LB, lettres pixel qui brillent -->
  <g fill="url(#lb)" filter="url(#glow)">
    <!-- L -->
    <rect x="1.7"  y="6.9"  width="2.6"  height="18.2"/>
    <rect x="1.7"  y="22.5" width="13.0" height="2.6"/>
    <!-- B -->
    <rect x="17.3" y="6.9"  width="2.6"  height="18.2"/>
    <rect x="17.3" y="6.9"  width="10.4" height="2.6"/>
    <rect x="17.3" y="14.7" width="10.4" height="2.6"/>
    <rect x="17.3" y="22.5" width="10.4" height="2.6"/>
    <rect x="27.7" y="9.5"  width="2.6"  height="5.2"/>
    <rect x="27.7" y="17.3" width="2.6"  height="5.2"/>
  </g>
</svg>
